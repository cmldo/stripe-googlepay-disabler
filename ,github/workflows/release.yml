name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'       # triggers on version tags like v1.0.0, v1.2.3
  workflow_dispatch:   # allow manual runs from the Actions tab

permissions:
  contents: write      # needed to create GitHub Releases and upload assets

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Java ─────────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── Gradle wrapper permissions ────────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x gradlew

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # ── Rename APK with version tag ───────────────────────────────────────────
      - name: Rename APK
        id: rename_apk
        run: |
          TAG="${GITHUB_REF_NAME:-manual}"
          SRC="app/build/outputs/apk/release/app-release.apk"
          DST="stripe-googlepay-disabler-${TAG}.apk"
          mv "$SRC" "$DST"
          echo "apk_path=$DST" >> "$GITHUB_OUTPUT"
          echo "apk_name=$DST" >> "$GITHUB_OUTPUT"

      # ── Upload artifact (available even without a tag / on manual runs) ───────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rename_apk.outputs.apk_name }}
          path: ${{ steps.rename_apk.outputs.apk_path }}
          retention-days: 30

      # ── Generate release notes from commits since last tag ────────────────────
      - name: Generate release notes
        id: release_notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s (%h)" | head -20)
          else
            NOTES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)")
          fi
          {
            echo "notes<<EOF"
            echo "## What's changed"
            echo ""
            echo "$NOTES"
            echo ""
            echo "---"
            echo "### Installation"
            echo "1. Install the APK on a device running LSPosed."
            echo "2. Enable the module in **LSPosed Manager → Modules**."
            echo "3. Set the scope to the app that embeds the Stripe SDK."
            echo "4. Force-stop (or reboot) the target app."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ── Create GitHub Release ─────────────────────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Stripe GooglePay Disabler ${{ github.ref_name }}"
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}   # e.g. v1.0.0-beta → pre-release
          files: ${{ steps.rename_apk.outputs.apk_path }}
