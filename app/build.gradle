plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.cmldo.stripehook'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.cmldo.stripehook'
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false   // Keep false: obfuscation breaks Xposed class/method lookup
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Strip unused resources to keep APK lean
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.DS_Store'
    }
}

dependencies {
    // Xposed API stub — compile-time only, provided by LSPosed at runtime
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'de.robv.android.xposed:api:82:sources'
}
