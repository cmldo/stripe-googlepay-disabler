plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.cmldo.stripehook'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.cmldo.stripehook'
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Xposed API stub — generated at build time in CI (see .github/workflows/release.yml)
    // For local development: run `./gradlew generateXposedStub` or place any api-XX.jar in app/libs/
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}
